name: Bootstrap source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/xz.part* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          tar -xJf /tmp/source.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add muhasebe program v1.4.1 source"
          git push
